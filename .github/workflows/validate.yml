name: Validar ChegaJá

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validar-chegaja-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Verificar JavaScript do painel
        run: |
          node --check public/chegaja-v199-driver.js
          node --check public/chegaja-v205-driver-fixes.js
          node --check public/chegaja-v217-driver-navigation.js
          node --check public/chegaja-v223-driver-final.js
          node --check public/chegaja-v224-driver-gps-markers.js
          node --check public/chegaja-v225-driver-polish.js
          node --check public/chegaja-v226-driver-map-gesture.js
          node --check public/chegaja-v227-address-search.js
          node --check public/chegaja-v228-driver-map-follow.js
          node --check public/sw.js
