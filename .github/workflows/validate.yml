name: Validar ChegaJá

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validar-chegaja-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Diagnóstico TypeScript completo
        continue-on-error: true
        run: npm run typecheck

      - name: Verificar TypeScript alterado
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log
          set -e
          if grep -E 'src/(lib/platform-config\.ts|lib/permissions\.ts|routes/(address-resilient|driver-live|map-safe|platform-v26|platform-v27|platform-v28|platform-v32|public-tracking-live)\.ts)' /tmp/tsc.log; then
            echo '::error::Erro TypeScript nos arquivos alterados.'
            exit 1
          fi

      - name: Verificar JavaScript ativo
        run: |
          node --check public/app.js
          node --check public/chegaja-final.js
          node --check public/chegaja-maps-leaflet.js
          node --check public/chegaja-v201-operational.js
          node --check public/chegaja-v205-driver-fixes.js
          node --check public/chegaja-v217-driver-navigation.js
          node --check public/chegaja-v227-address-search.js
          node --check public/chegaja-v232-navigation-final.js
          node --check public/sw.js

      - name: Verificar mapas, permissões e produção
        run: node scripts/test-v14153-logo-google-maps.mjs

      - name: Simular build do Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler-build
