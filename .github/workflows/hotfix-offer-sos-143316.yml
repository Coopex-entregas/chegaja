name: Consolidar painel do cooperado 14.33.24

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-driver-navigation-143324.py'
      - '.github/workflows/hotfix-offer-sos-143316.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar navegação real
        run: python3 scripts/fix-driver-navigation-143324.py

      - name: Validar JavaScript e TypeScript
        run: |
          node --check public/chegaja-v217-driver-navigation.js
          npx tsc --noEmit

      - name: Validar mapa e voz brasileira
        run: |
          python3 - <<'PY'
          from pathlib import Path
          driver=Path('public/chegaja-v217-driver-navigation.js').read_text(encoding='utf-8')
          css=Path('public/chegaja-v217-driver-navigation.css').read_text(encoding='utf-8')
          nav=Path('src/routes/platform-v32.ts').read_text(encoding='utf-8')
          index=Path('public/index.html').read_text(encoding='utf-8')
          checks={
            'versão':'ChegaJá 14.33.24' in driver,
            'guard':'__CJ_DRIVER_LEAFLET_143324__=true' in driver,
            'rota azul':'drawRoute(pts)' in driver,
            'destino backend':'nav.next?.lat' in driver,
            'voz pt-BR':"u.lang='pt-BR'" in driver,
            'seleção pt-BR':"toLowerCase()==='pt-br'" in driver,
            'sem halo grande':'cj217-self-icon:before{display:none!important' in css,
            'seta compacta':'width:22px!important' in css,
            'geocodificação':'nominatim.openstreetmap.org/search' in nav,
            'salva coleta':'UPDATE deliveries SET pickup_lat=' in nav,
            'salva entrega':'UPDATE deliveries SET delivery_lat=' in nav,
            'app version':'app-version" content="14.33.24"' in index,
            'js cache':'chegaja-v217-driver-navigation.js?v=14.33.24&recovery=143324' in index,
            'css cache':'chegaja-v217-driver-navigation.css?v=14.33.24&recovery=143324' in index,
          }
          failed=[name for name,ok in checks.items() if not ok]
          print(checks)
          if failed: raise SystemExit('Falharam: '+', '.join(failed))
          PY

      - name: Rodar teste regressivo
        run: node scripts/test-v14153-logo-google-maps.mjs

      - name: Gravar na main
        run: |
          if git diff --quiet -- public/index.html public/chegaja-v217-driver-navigation.js public/chegaja-v217-driver-navigation.css src/routes/platform-v32.ts scripts/test-v14153-logo-google-maps.mjs; then
            echo "Sem alterações pendentes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/chegaja-v217-driver-navigation.js public/chegaja-v217-driver-navigation.css src/routes/platform-v32.ts scripts/test-v14153-logo-google-maps.mjs
          git commit -m "fix: rota real marcador compacto e voz pt-BR 14.33.24"
          git push origin HEAD:main
