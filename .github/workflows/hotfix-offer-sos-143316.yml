name: Consolidar áudio do cooperado 14.33.22

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-driver-audio-143322.py'
      - '.github/workflows/hotfix-offer-sos-143316.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar correção 14.33.22
        run: python3 scripts/fix-driver-audio-143322.py

      - name: Validar JavaScript e TypeScript
        run: |
          node --check public/chegaja-v217-driver-navigation.js
          node --check public/chegaja-final.js
          npx tsc --noEmit

      - name: Validar áudio persistente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          driver=Path('public/chegaja-v217-driver-navigation.js').read_text(encoding='utf-8')
          index=Path('public/index.html').read_text(encoding='utf-8')
          checks={
            'versão':'ChegaJá 14.33.22' in driver,
            'guard':'__CJ_DRIVER_LEAFLET_143322__=true' in driver,
            'wav':'function alarmWavUrl()' in driver,
            'audio element':'new Audio()' in driver,
            'preparo':'function primeAlarmMedia(test=false)' in driver,
            'gesto':'installAudioArm()' in driver,
            'teste iniciar':'primeAlarmMedia(!A.online)' in driver,
            'desmutar':'media.muted=false' in driver,
            'fallback webaudio':"type:'square'" in driver and "type:'sawtooth'" in driver,
            'repetição':'setInterval(fire,2700)' in driver,
            'app version':'app-version" content="14.33.22"' in index,
            'js cache':'chegaja-v217-driver-navigation.js?v=14.33.22&recovery=143322' in index,
            'css cache':'chegaja-v217-driver-navigation.css?v=14.33.22&recovery=143322' in index,
          }
          failed=[name for name,ok in checks.items() if not ok]
          print(checks)
          if failed: raise SystemExit('Falharam: '+', '.join(failed))
          PY

      - name: Rodar teste regressivo
        run: node scripts/test-v14153-logo-google-maps.mjs

      - name: Gravar na main
        run: |
          if git diff --quiet; then
            echo "Sem alterações pendentes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/chegaja-v217-driver-navigation.js public/chegaja-v217-driver-navigation.css scripts/test-v14153-logo-google-maps.mjs
          git commit -m "fix: áudio persistente desbloqueado no iniciar 14.33.22"
          git push origin HEAD:main
