name: Consolidar navegação e alerta do cooperado 14.33.21

on:
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate-driver-143317.py'
      - '.github/workflows/hotfix-offer-sos-143316.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar correção 14.33.21
        run: python3 scripts/consolidate-driver-143317.py

      - name: Validar JavaScript e TypeScript
        run: |
          node --check public/chegaja-v217-driver-navigation.js
          node --check public/chegaja-final.js
          npx tsc --noEmit

      - name: Validar trajeto e alerta
        run: |
          grep -q 'ChegaJá 14.33.21' public/chegaja-v217-driver-navigation.js
          grep -q '__CJ_DRIVER_LEAFLET_143321__=true' public/chegaja-v217-driver-navigation.js
          grep -q "createPane('cj217-route-pane')" public/chegaja-v217-driver-navigation.js
          grep -q "L.svg({pane:'cj217-route-pane'" public/chegaja-v217-driver-navigation.js
          grep -q "navigation?lat=" public/chegaja-v217-driver-navigation.js
          grep -q "type:'square'" public/chegaja-v217-driver-navigation.js
          grep -q "type:'sawtooth'" public/chegaja-v217-driver-navigation.js
          grep -q 'setInterval(fire,2700)' public/chegaja-v217-driver-navigation.js
          grep -q "c.req.query('lat')" src/routes/platform-v32.ts
          grep -q "c.req.query('lng')" src/routes/platform-v32.ts
          grep -q 'app-version" content="14.33.21"' public/index.html
          grep -q 'chegaja-v217-driver-navigation.js?v=14.33.21&recovery=143321' public/index.html
          grep -q 'chegaja-v217-driver-navigation.css?v=14.33.21&recovery=143321' public/index.html
          grep -q 'chegaja-final.js?v=14.33.21&recovery=143321' public/index.html

      - name: Rodar teste regressivo
        run: node scripts/test-v14153-logo-google-maps.mjs

      - name: Gravar na main
        run: |
          if git diff --quiet; then
            echo "Sem alterações pendentes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/chegaja-v217-driver-navigation.js public/chegaja-v217-driver-navigation.css src/routes/platform-v32.ts scripts/test-v14153-logo-google-maps.mjs
          git commit -m "fix: rota azul visível e alerta reforçado 14.33.21"
          git push origin HEAD:main
