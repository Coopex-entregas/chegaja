name: Consolidar entrada e fuso 14.33.30

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-driver-navigation-143329.py'
      - '.github/workflows/hotfix-offer-sos-143316.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar somente a versão atual
        run: python3 scripts/fix-driver-navigation-143329.py

      - name: Validar JavaScript e TypeScript
        run: |
          node --check public/chegaja-v217-driver-navigation.js
          node --check public/app.js
          npx tsc --noEmit

      - name: Validar login no Início e fuso do Brasil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('public/app.js').read_text(encoding='utf-8')
          index=Path('public/index.html').read_text(encoding='utf-8')
          driver=Path('public/chegaja-v217-driver-navigation.js').read_text(encoding='utf-8')
          checks={
            'app version':'app-version" content="14.33.30"' in index,
            'painel preservado':'ChegaJá 14.33.29' in driver and '__CJ_DRIVER_LEAFLET_143329__=true' in driver,
            'fuso':'APP_TIME_ZONE=\'America/Sao_Paulo\'' in app,
            'sql utc':'sqlUtc.test(text)' in app and "text.replace(' ','T')+'Z'" in app,
            'login marca sessão':"sessionStorage.setItem('cj_driver_fresh_login','1')" in app,
            'login força dashboard':"state.page='dashboard'" in app and "freshDriver?'dashboard'" in app,
            'limpa marcador':"sessionStorage.removeItem('cj_driver_fresh_login')" in app,
            'cache app':'/app.js?v=14.33.30&recovery=143330' in index,
            'cache final':'/chegaja-final.js?v=14.33.30&recovery=143330' in index,
          }
          failed=[name for name,ok in checks.items() if not ok]
          print(checks)
          if failed: raise SystemExit('Falharam: '+', '.join(failed))
          PY

      - name: Rodar teste regressivo
        run: node scripts/test-v14153-logo-google-maps.mjs

      - name: Gravar na main
        run: |
          if git diff --quiet -- public/index.html public/app.js scripts/test-v14153-logo-google-maps.mjs; then
            echo "Sem alterações pendentes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/app.js scripts/test-v14153-logo-google-maps.mjs
          git commit -m "fix: iniciar cooperado no mapa e corrigir fuso 14.33.30"
          git push origin HEAD:main
