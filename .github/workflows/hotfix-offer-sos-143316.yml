name: Consolidar fluxo de coleta 14.33.31

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-driver-pickup-143331.py'
      - '.github/workflows/hotfix-offer-sos-143316.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar somente a versão atual
        run: python3 scripts/fix-driver-pickup-143331.py

      - name: Validar JavaScript e TypeScript
        run: |
          node --check public/chegaja-v217-driver-navigation.js
          node --check public/app.js
          npx tsc --noEmit

      - name: Validar coleta, entrada e fuso
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('public/app.js').read_text(encoding='utf-8')
          driver=Path('public/chegaja-v217-driver-navigation.js').read_text(encoding='utf-8')
          v28=Path('src/routes/platform-v28.ts').read_text(encoding='utf-8')
          index=Path('public/index.html').read_text(encoding='utf-8')
          checks={
            'versão':'app-version" content="14.33.31"' in index,
            'driver':'ChegaJá 14.33.31' in driver and '__CJ_DRIVER_LEAFLET_143331__=true' in driver,
            'chegada transacional':"manual:true,stage:'pickup'" in driver and 'Confirme COLETA REALIZADA somente depois de retirar o pedido' in driver,
            'sem coleta GPS':"item.status==='at_pickup'&&distance>=200" not in v28 and 'Nunca avançar at_pickup -> in_route por GPS' in v28,
            'estabelecimento sem wait':"delivery_type||'')!=='establishment'" in driver,
            'fuso':"APP_TIME_ZONE='America/Sao_Paulo'" in app and 'APP_SQL_UTC.test(text)' in app,
            'login inicio':"sessionStorage.setItem('cj_driver_fresh_login','1')" in app and "freshDriver?'dashboard'" in app,
            'cache app':'/app.js?v=14.33.31&recovery=143331' in index,
            'cache driver':'chegaja-v217-driver-navigation.js?v=14.33.31&recovery=143331' in index,
          }
          failed=[name for name,ok in checks.items() if not ok]
          print(checks)
          if failed: raise SystemExit('Falharam: '+', '.join(failed))
          PY

      - name: Rodar teste regressivo
        run: node scripts/test-v14153-logo-google-maps.mjs

      - name: Gravar na main
        run: |
          if git diff --quiet -- public/index.html public/app.js public/chegaja-v217-driver-navigation.js src/routes/platform-v28.ts scripts/test-v14153-logo-google-maps.mjs; then
            echo "Sem alterações pendentes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/app.js public/chegaja-v217-driver-navigation.js src/routes/platform-v28.ts scripts/test-v14153-logo-google-maps.mjs
          git commit -m "fix: tornar chegada e coleta consistentes 14.33.31"
          git push origin HEAD:main
