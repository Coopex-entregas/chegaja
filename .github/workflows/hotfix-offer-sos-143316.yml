name: Consolidar rota sem linha reta 14.33.32

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-driver-route-143332.py'
      - '.github/workflows/hotfix-offer-sos-143316.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar somente a versão atual
        run: python3 scripts/fix-driver-route-143332.py

      - name: Validar JavaScript e TypeScript
        run: |
          node --check public/chegaja-v217-driver-navigation.js
          node --check public/app.js
          npx tsc --noEmit

      - name: Validar rota sem linha reta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          driver=Path('public/chegaja-v217-driver-navigation.js').read_text(encoding='utf-8')
          index=Path('public/index.html').read_text(encoding='utf-8')
          checks={
            'versão':'app-version" content="14.33.32"' in index,
            'driver':'ChegaJá 14.33.32' in driver and '__CJ_DRIVER_LEAFLET_143332__=true' in driver,
            'cache driver':'chegaja-v217-driver-navigation.js?v=14.33.32&recovery=143332' in index,
            'sem reta provisória':'drawRoute([{...origin},{...target}])' not in driver,
            'sem reta fallback':'pts=[{...origin},{...target}]' not in driver,
            'retry':'routeRetryTimer' in driver and 'updateRoute(true)},2500)' in driver,
            'osrm preservado':'router.project-osrm.org' in driver,
          }
          failed=[name for name,ok in checks.items() if not ok]
          print(checks)
          if failed: raise SystemExit('Falharam: '+', '.join(failed))
          PY

      - name: Rodar teste regressivo
        run: node scripts/test-v14153-logo-google-maps.mjs

      - name: Gravar na main
        run: |
          if git diff --quiet -- public/index.html public/chegaja-v217-driver-navigation.js scripts/test-v14153-logo-google-maps.mjs; then
            echo "Sem alterações pendentes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/chegaja-v217-driver-navigation.js scripts/test-v14153-logo-google-maps.mjs
          git commit -m "fix: manter rota válida e remover linha reta 14.33.32"
          git push origin HEAD:main
