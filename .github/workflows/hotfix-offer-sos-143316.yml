name: Consolidar painel do cooperado 14.33.26

on:
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate-driver-navigation-143326.py'
      - '.github/workflows/hotfix-offer-sos-143316.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar somente a versão atual
        run: python3 scripts/consolidate-driver-navigation-143326.py

      - name: Validar JavaScript e TypeScript
        run: |
          node --check public/chegaja-v217-driver-navigation.js
          node --check public/app.js
          npx tsc --noEmit

      - name: Validar navegação heading-up, rota, voz e abas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          driver=Path('public/chegaja-v217-driver-navigation.js').read_text(encoding='utf-8')
          css=Path('public/chegaja-v217-driver-navigation.css').read_text(encoding='utf-8')
          nav=Path('src/routes/platform-v32.ts').read_text(encoding='utf-8')
          app=Path('public/app.js').read_text(encoding='utf-8')
          index=Path('public/index.html').read_text(encoding='utf-8')
          checks={
            'versão':'ChegaJá 14.33.26' in driver,
            'guard':'__CJ_DRIVER_LEAFLET_143326__=true' in driver,
            'leaflet rotate':'leaflet-rotate@0.2.8/dist/leaflet-rotate.js' in index,
            'mapa rotacionável':"rotate:typeof L.Map?.prototype?.setBearing==='function'" in driver,
            'bearing':'function applyMapBearing(force=false)' in driver,
            'posição seta':'L.marker(ll' in driver and 'selfIcon()' in driver,
            'rota padrão':"className:'cj217-route-line'" in driver,
            'setas da rota':'function drawRouteArrows()' in driver,
            'setas de manobra':'function drawManeuvers(steps)' in driver,
            'bússola iPhone':'webkitCompassHeading' in driver,
            'permissão iOS':'DeviceOrientationEvent.requestPermission' in driver,
            'botão orientação':'id="cj217-bearing"' in driver and '#cj217-bearing' in css,
            'mapa limpo':'leaflet-tile-pane{filter:saturate' in css,
            'destino backend':'nav.next?.lat' in driver,
            'voz pt-BR':"u.lang='pt-BR'" in driver,
            'geocodificação':'nominatim.openstreetmap.org/search' in nav,
            'login início':'state.freshLogin=true' in app and "targetPage=freshDriver?'dashboard'" in app,
            'mantém aba':'location.hash.slice(1)||defaultPage' in app,
            'app version':'app-version" content="14.33.26"' in index,
            'js cache':'chegaja-v217-driver-navigation.js?v=14.33.26&recovery=143326' in index,
            'css cache':'chegaja-v217-driver-navigation.css?v=14.33.26&recovery=143326' in index,
          }
          failed=[name for name,ok in checks.items() if not ok]
          print(checks)
          if failed: raise SystemExit('Falharam: '+', '.join(failed))
          PY

      - name: Rodar teste regressivo
        run: node scripts/test-v14153-logo-google-maps.mjs

      - name: Gravar na main
        run: |
          if git diff --quiet -- public/index.html public/chegaja-v217-driver-navigation.js public/chegaja-v217-driver-navigation.css scripts/test-v14153-logo-google-maps.mjs; then
            echo "Sem alterações pendentes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/chegaja-v217-driver-navigation.js public/chegaja-v217-driver-navigation.css scripts/test-v14153-logo-google-maps.mjs
          git commit -m "fix: navegação gira com direção e mostra manobras 14.33.26"
          git push origin HEAD:main
