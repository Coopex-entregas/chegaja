name: Consolidar painel do cooperado 14.33.28

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-driver-navigation-143328.py'
      - '.github/workflows/hotfix-offer-sos-143316.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Aplicar somente a versão atual
        run: python3 scripts/fix-driver-navigation-143328.py

      - name: Validar JavaScript e TypeScript
        run: |
          node --check public/chegaja-v217-driver-navigation.js
          node --check public/app.js
          npx tsc --noEmit

      - name: Validar orientação correta da navegação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          driver=Path('public/chegaja-v217-driver-navigation.js').read_text(encoding='utf-8')
          css=Path('public/chegaja-v217-driver-navigation.css').read_text(encoding='utf-8')
          index=Path('public/index.html').read_text(encoding='utf-8')
          checks={
            'versão':'ChegaJá 14.33.28' in driver,
            'guard':'__CJ_DRIVER_LEAFLET_143328__=true' in driver,
            'rotação inversa':'function mapRotationForHeading(heading)' in driver and 'normAngle(360-h)' in driver,
            'bearing usa rotação':'wanted=target==null?0:mapRotationForHeading(target)' in driver,
            'seta compensada':'angle=h==null?0:normAngle(h+mapBearing)' in driver,
            'auto obrigatório':'function toggleBearingMode(){A.headingUp=true' in driver,
            'próxima manobra':"if(type==='depart')continue" in driver and 'próxima manobra' in driver,
            'rota limpa':'cj217-route-direction-icon{display:none!important' in css,
            'leaflet rotate':'leaflet-rotate@0.2.8/dist/leaflet-rotate.js' in index,
            'app version':'app-version" content="14.33.28"' in index,
            'js cache':'chegaja-v217-driver-navigation.js?v=14.33.28&recovery=143328' in index,
            'css cache':'chegaja-v217-driver-navigation.css?v=14.33.28&recovery=143328' in index,
          }
          failed=[name for name,ok in checks.items() if not ok]
          print(checks)
          if failed: raise SystemExit('Falharam: '+', '.join(failed))
          PY

      - name: Rodar teste regressivo
        run: node scripts/test-v14153-logo-google-maps.mjs

      - name: Gravar na main
        run: |
          if git diff --quiet -- public/index.html public/chegaja-v217-driver-navigation.js public/chegaja-v217-driver-navigation.css scripts/test-v14153-logo-google-maps.mjs; then
            echo "Sem alterações pendentes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/chegaja-v217-driver-navigation.js public/chegaja-v217-driver-navigation.css scripts/test-v14153-logo-google-maps.mjs
          git commit -m "fix: corrigir sentido da câmera 14.33.28"
          git push origin HEAD:main
