name: Consolidar navegação do cooperado 14.33.19

on:
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate-driver-143317.py'
      - '.github/workflows/hotfix-offer-sos-143316.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção
        run: python3 scripts/consolidate-driver-143317.py
      - name: Validar JavaScript principal
        run: |
          node --check public/chegaja-v217-driver-navigation.js
          node --check public/app.js
          node --check public/chegaja-v201-operational.js
      - name: Validar retorno ao mapa e rota
        run: |
          grep -q 'ChegaJá 14.33.19' public/chegaja-v217-driver-navigation.js
          grep -q '__CJ_DRIVER_LEAFLET_143319__=true' public/chegaja-v217-driver-navigation.js
          grep -q 'oldDeliveries' public/chegaja-v217-driver-navigation.js
          grep -q "page==='deliveries'" public/chegaja-v217-driver-navigation.js
          grep -q 'await forceDriverHome()' public/chegaja-v217-driver-navigation.js
          grep -q 'pts=\[{...origin},{...target}\]' public/chegaja-v217-driver-navigation.js
          grep -q 'zIndexOffset:5000' public/chegaja-v217-driver-navigation.js
          grep -q 'navegação sempre visível' public/chegaja-v217-driver-navigation.css
          grep -q 'app-version" content="14.33.19"' public/index.html
          grep -q 'chegaja-v217-driver-navigation.js?v=14.33.19&recovery=143319' public/index.html
          grep -q 'chegaja-v217-driver-navigation.css?v=14.33.19&recovery=143319' public/index.html
      - name: Rodar teste regressivo
        run: node scripts/test-v14153-logo-google-maps.mjs
      - name: Gravar na main
        run: |
          if git diff --quiet; then
            echo "Sem alterações pendentes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/chegaja-v217-driver-navigation.js public/chegaja-v217-driver-navigation.css scripts/test-v14153-logo-google-maps.mjs
          git commit -m "fix: aceitar volta ao mapa com seta e rota 14.33.19"
          git push origin HEAD:main
