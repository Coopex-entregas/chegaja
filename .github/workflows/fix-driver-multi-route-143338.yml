name: Consolidar prioridade de rotas 14.33.38

# Publicação direta para a Cloudflare da regra multi-entrega 14.33.38.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-driver-multi-route-143338.py'
      - '.github/workflows/fix-driver-multi-route-143338.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Aplicar 14.33.38
        run: python3 scripts/fix-driver-multi-route-143338.py
      - name: Normalizar versão e teste
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html'); s=p.read_text()
          s=s.replace('content="14.33.37"','content="14.33.38"',1).replace('content="14.33.36"','content="14.33.38"',1)
          s=s.replace('/chegaja-v217-driver-navigation.js?v=14.33.36&recovery=143336','/chegaja-v217-driver-navigation.js?v=14.33.38&recovery=143338')
          p.write_text(s)
          p=Path('scripts/test-v14153-logo-google-maps.mjs'); s=p.read_text()
          s=s.replace('14\\.33\\.36','14\\.33\\.38').replace('recovery=143336','recovery=143338')
          s=s.replace('ChegaJá 14\\.33\\.35','ChegaJá 14\\.33\\.38')
          p.write_text(s)
          PY
      - name: Validar JavaScript
        run: node --check public/chegaja-v217-driver-navigation.js
      - name: Validar TypeScript
        run: npm run typecheck
      - name: Validar prioridade das paradas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          nav=Path('src/routes/platform-v32.ts').read_text()
          driver=Path('public/chegaja-v217-driver-navigation.js').read_text()
          index=Path('public/index.html').read_text()
          checks={
            'empate de 300 m':'DELIVERY_TIE_METERS=300' in nav,
            'prioridade entrega':'delivery_priority_tie' in nav,
            'coleta em andamento travada':'pickup_in_progress' in nav,
            'sincronização multi-entrega':'function syncDetailToNavigation(next)' in driver,
            'lista ativa':'function basicFromLive(live)' in driver,
            'versão pública':'app-version" content="14.33.38"' in index and 'v=14.33.38&recovery=143338' in index,
          }
          missing=[name for name,ok in checks.items() if not ok]
          if missing: raise SystemExit('Falhou: '+', '.join(missing))
          print('Prioridade multi-entrega validada:', ', '.join(checks))
          PY
      - name: Teste regressivo do cooperado
        run: node scripts/test-v14153-logo-google-maps.mjs
      - name: Gravar na main
        run: |
          if git diff --quiet; then
            echo 'Sem alterações pendentes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/platform-v32.ts public/chegaja-v217-driver-navigation.js public/index.html scripts/test-v14153-logo-google-maps.mjs
          git commit -m 'fix: prioridade clara entre coleta e entrega 14.33.38'
          git push origin main
