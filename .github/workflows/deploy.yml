name: Publicar ChegaJá

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      aplicar_migracoes:
        description: Aplicar migrações D1 antes de publicar
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publicar-chegaja
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar credenciais da Cloudflare
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Não encontrei CLOUDFLARE_API_TOKEN nem API_TOKEN nos Secrets do GitHub."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Não encontrei CLOUDFLARE_ACCOUNT_ID nem ACCOUNT_ID nos Secrets ou Variables do GitHub."
            exit 1
          fi

      - name: Aplicar migrações D1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.aplicar_migracoes == true }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Publicar Worker
        run: npx wrangler deploy
